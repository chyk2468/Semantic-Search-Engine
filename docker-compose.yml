services:
  semantic-search:
    build: .
    ports:
      - "8000:8000"
    # Persist the vector store so that index updates are not lost when the container is recreated.
    # Note: If running on Windows, using a named volume is recommended for best performance.
    volumes:
      - chroma_data:/app/chroma_store
    environment:
      # Tunable similarity threshold for the semantic cache
      - SIMILARITY_THRESHOLD=0.85
      # Disable ChromaDB telemetry to prevent 'Failed to send telemetry event' errors
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_TELEMETRY_IMPL=none
    # Automatically restart the service unless it's explicitly stopped.
    restart: unless-stopped

volumes:
  # Named volume for ChromaDB persistence
  chroma_data:
