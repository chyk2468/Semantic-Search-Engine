<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trademarkia Semantic Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .result-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-16 px-4 pb-16">
    <div class="w-full max-w-4xl glass rounded-2xl p-8 shadow-2xl mb-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Semantic Search Engine
            </h1>
            <div class="flex gap-4">
                <button onclick="fetchStats()" class="text-sm px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors border border-slate-700">Cache Stats</button>
                <button onclick="clearCache()" class="text-sm px-4 py-2 bg-red-900/50 hover:bg-red-900/80 text-red-200 rounded-lg transition-colors border border-red-800/50">Clear Cache</button>
            </div>
        </div>

        <form id="searchForm" class="relative mb-8" onsubmit="handleSearch(event)">
            <input type="text" id="searchInput" placeholder="Ask anything... e.g. What is the latest news about space exploration?" 
                class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-4 pl-6 pr-16 text-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500"
                required minlength="3">
            <button type="submit" id="searchBtn" class="absolute right-3 top-3 bottom-3 bg-blue-600 hover:bg-blue-500 text-white px-6 rounded-lg font-medium transition-colors flex items-center justify-center min-w-[100px]">
                Search
            </button>
        </form>

        <div id="resultsContainer" class="hidden space-y-6">
            <div class="flex flex-wrap items-center gap-4 text-sm text-slate-400 border-b border-slate-800 pb-4">
                <div id="badgeCache" class="px-3 py-1 rounded-full text-xs font-semibold"></div>
                <div id="clusterInfo" class="flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span>Topic: <span id="clusterName" class="text-white font-medium"></span></span>
                    <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-500 ml-1">ID: <span id="clusterId"></span></span>
                </div>
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Time: <span id="responseTime" class="text-white font-medium"></span>ms</span>
                </div>
            </div>
            
            <div id="matchedQueryContainer" class="hidden bg-slate-800/50 border border-slate-700 rounded-lg p-4 mb-4">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Matched Cached Query</span>
                <p id="matchedQueryText" class="text-blue-300 mt-1 italic"></p>
                <div id="simScoreContainer" class="text-xs text-slate-500 mt-1">Similarity: <span id="simScore" class="text-blue-400"></span></div>
            </div>

            <!-- Cluster Distribution Visualization -->
            <div class="bg-slate-900/30 p-4 rounded-xl border border-slate-800/50">
                <span class="text-xs text-slate-500 uppercase tracking-wider font-semibold block mb-2">Cluster Distribution (Fuzzy Membership)</span>
                <div id="distributionBar" class="flex h-2 w-full rounded-full overflow-hidden bg-slate-800">
                    <!-- Bars injected here -->
                </div>
            </div>

            <div id="textContent" class="text-slate-300 leading-relaxed font-mono text-sm result-enter"></div>
        </div>
    </div>

    <!-- Modal for Stats -->
    <div id="statsModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 backdrop-blur-sm">
        <div class="glass p-8 rounded-2xl w-full max-w-md relative">
            <button onclick="closeStats()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            <h2 class="text-2xl font-bold mb-6">Cache Statistics</h2>
            <div id="statsContent" class="space-y-4 font-mono text-sm text-slate-300">
                <!-- Stats will be injected here -->
            </div>
        </div>
    </div>

    <script>
        async function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('searchInput').value;
            const btn = document.getElementById('searchBtn');
            const container = document.getElementById('resultsContainer');
            
            btn.innerHTML = '<span class="loader w-5 h-5"></span>';
            btn.disabled = true;
            container.classList.add('hidden');
            
            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: input})
                });
                
                if (!res.ok) throw new Error('Search failed');
                const data = await res.json();
                
                // Update Badge & Headers
                const badge = document.getElementById('badgeCache');
                if (data.cache_hit) {
                    badge.textContent = '⚡ CACHE HIT';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                    document.getElementById('matchedQueryContainer').classList.remove('hidden');
                    document.getElementById('matchedQueryText').textContent = `"${data.matched_query}"`;
                    document.getElementById('simScore').textContent = data.similarity_score;
                } else {
                    badge.textContent = '🔍 VECTOR SEARCH (MISS)';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    document.getElementById('matchedQueryContainer').classList.add('hidden');
                }
                
                document.getElementById('clusterId').textContent = data.dominant_cluster;
                document.getElementById('clusterName').textContent = data.dominant_cluster_name;
                document.getElementById('responseTime').textContent = data.response_time_ms;

                // Update Distribution Bar
                const distBar = document.getElementById('distributionBar');
                distBar.innerHTML = '';
                const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-cyan-500'];
                data.cluster_distribution.forEach((val, i) => {
                    if (val > 0.05) {
                        const segment = document.createElement('div');
                        segment.className = `${colors[i % colors.length]} h-full transition-all duration-500`;
                        segment.style.width = `${val * 100}%`;
                        segment.title = `Cluster ${i}: ${(val * 100).toFixed(1)}%`;
                        distBar.appendChild(segment);
                    }
                });
                
                // Render Results
                let formattedHtml = data.result.map((item, idx) => `
                    <div class="mb-6 bg-slate-900/50 p-6 rounded-xl border border-slate-800 overflow-hidden result-enter" style="animation-delay: ${idx * 0.1}s">
                        <div class="flex justify-between items-start mb-4 border-b border-slate-800 pb-3">
                            <div>
                                <span class="text-xs text-blue-400 font-bold uppercase tracking-widest">Match ${idx + 1}</span>
                                <div class="text-[10px] text-slate-500 mt-1">ID: ${item.id}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-emerald-400">${(item.similarity * 100).toFixed(1)}% Similarity</div>
                                <div class="text-[10px] text-slate-500 uppercase">${item.metadata.category}</div>
                            </div>
                        </div>
                        <div class="text-slate-300 whitespace-pre-wrap break-all">${item.text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}...</div>
                        <div class="mt-4 flex gap-4 text-[10px] text-slate-600 font-semibold">
                            <span>WORDS: ${item.metadata.word_count}</span>
                            <span>CLUSTER: ${item.metadata.cluster_id}</span>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('textContent').innerHTML = formattedHtml;
                container.classList.remove('hidden');
                
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.innerHTML = 'Search';
                btn.disabled = false;
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/cache/stats');
                const data = await res.json();
                
                const html = `
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span>Hits</span><span class="text-emerald-400 font-bold">${data.hits}</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span>Misses</span><span class="text-blue-400 font-bold">${data.misses}</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span>Hit Rate</span><span class="text-white font-bold">${(data.hit_rate * 100).toFixed(1)}%</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span>Cache Size</span><span class="text-white font-bold">${data.size}</span>
                    </div>
                    <div class="pt-2">
                        <span class="text-slate-500 text-xs uppercase font-bold">Per Cluster Hits</span>
                        <div class="mt-2 grid grid-cols-2 gap-2">
                            ${Object.entries(data.per_cluster_hits).map(([k,v]) => 
                                `<div class="bg-slate-800 p-2 rounded text-center">C${k}: <span class="text-white">${v}</span></div>`
                            ).join('') || '<div class="col-span-2 text-slate-600 italic">No hits recorded</div>'}
                        </div>
                    </div>
                `;
                
                document.getElementById('statsContent').innerHTML = html;
                document.getElementById('statsModal').classList.remove('hidden');
            } catch (e) {
                alert('Failed to load stats');
            }
        }

        function closeStats() {
            document.getElementById('statsModal').classList.add('hidden');
        }

        async function clearCache() {
            if(!confirm('Are you sure you want to flush the cache?')) return;
            try {
                const res = await fetch('/cache', {method: 'DELETE'});
                const data = await res.json();
                alert(data.message);
                document.getElementById('resultsContainer').classList.add('hidden');
            } catch (e) {
                alert('Failed to clear cache');
            }
        }
    </script>
</body>
</html>
