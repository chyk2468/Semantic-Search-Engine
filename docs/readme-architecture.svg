<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Semantic Search Engine workflow</title><desc id="desc">The React interface sends a query to a FastAPI service, which embeds it, checks semantic cache, searches ChromaDB, and returns ranked results.</desc><rect width="1200" height="400" rx="18" fill="#F1F2F5"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#646CBA">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#252936">Semantic Search Engine</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#697181">Natural-language query to ranked context</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D9DCE5"/><path d="M 300 237 L 330 237" stroke="#697181" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#697181" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#697181" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#697181" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#697181" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#697181" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#646CBA"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#646CBA">01 / QUERY</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#252936">Search text</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697181">Enter a natural-language question.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#3E7F84"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#3E7F84">02 / API</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#252936">FastAPI endpoint</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697181">Validate and embed the query.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#9C8066"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#9C8066">03 / RETRIEVE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#252936">ChromaDB + cache</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697181">Find semantically relevant passages.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#646CBA"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#646CBA">04 / RESULTS</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#252936">Ranked matches</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697181">Show matches, clusters, and timing.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#646CBA">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697181">Embeddings and stored data must be prepared before useful search results are available.</text></svg>